# Requires an Ingress controller installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-assistant
spec:
  rules:
    - host: medical-assistant.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medical-assistant
                port:
                  number: 80
